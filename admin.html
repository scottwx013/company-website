<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宜礼商城 - 管理后台</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <h1>宜礼商城 - 管理后台</h1>
            <div class="admin-actions">
                <span id="admin-username">管理员</span>
                <button id="logout-btn">退出登录</button>
            </div>
        </header>

        <div class="admin-main">
            <aside class="admin-sidebar">
                <nav class="admin-nav">
                    <a href="#dashboard" class="nav-link active" data-page="dashboard">
                        <span class="nav-icon">📊</span>
                        数据概览
                    </a>
                    <a href="#orders" class="nav-link" data-page="orders">
                        <span class="nav-icon">📦</span>
                        订单管理
                        <span class="badge" id="order-badge">0</span>
                    </a>
                    <a href="#products" class="nav-link" data-page="products">
                        <span class="nav-icon">🎁</span>
                        商品管理
                    </a>
                    <a href="#users" class="nav-link" data-page="users">
                        <span class="nav-icon">👥</span>
                        用户管理
                    </a>
                    <a href="#settings" class="nav-link" data-page="settings">
                        <span class="nav-icon">⚙️</span>
                        系统设置
                    </a>
                </nav>
            </aside>

            <main class="admin-content">
                <!-- 数据概览 -->
                <section id="dashboard-page" class="admin-page active">
                    <h2 class="page-title">数据概览</h2>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-icon">📦</div>
                            <div class="stat-info">
                                <div class="stat-value" id="stat-total-orders">0</div>
                                <div class="stat-label">总订单数</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">💰</div>
                            <div class="stat-info">
                                <div class="stat-value" id="stat-total-revenue">¥0</div>
                                <div class="stat-label">总销售额</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">👤</div>
                            <div class="stat-info">
                                <div class="stat-value" id="stat-total-users">0</div>
                                <div class="stat-label">注册用户</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">🎁</div>
                            <div class="stat-info">
                                <div class="stat-value" id="stat-total-products">0</div>
                                <div class="stat-label">商品数量</div>
                            </div>
                        </div>
                    </div>

                    <div class="dashboard-sections">
                        <div class="dashboard-card">
                            <h3>今日订单</h3>
                            <div class="order-list" id="today-orders">
                                <div class="empty-state">加载中...</div>
                            </div>
                        </div>
                        <div class="dashboard-card">
                            <h3>待处理订单</h3>
                            <div class="order-list" id="pending-orders">
                                <div class="empty-state">加载中...</div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 订单管理 -->
                <section id="orders-page" class="admin-page">
                    <div class="page-header">
                        <h2 class="page-title">订单管理</h2>
                        <div class="filter-bar">
                            <select id="order-status-filter">
                                <option value="">全部状态</option>
                                <option value="pending">待付款</option>
                                <option value="paid">已付款</option>
                                <option value="shipped">已发货</option>
                                <option value="completed">已完成</option>
                                <option value="cancelled">已取消</option>
                            </select>
                            <input type="text" id="order-search" placeholder="搜索订单号/用户名...">
                        <button id="export-orders" class="btn-secondary">📥 导出</button>
                            <button id="refresh-orders">刷新</button>
                        </div>
                    </div>
                    <div class="table-container">
                        <table class="admin-table" id="orders-table">
                            <thead>
                                <tr>
                                    <th>订单号</th>
                                    <th>用户信息</th>
                                    <th>商品</th>
                                    <th>金额</th>
                                    <th>状态</th>
                                    <th>时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="orders-tbody">
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination" id="orders-pagination"></div>
                </section>

                <!-- 商品管理 -->
                <section id="products-page" class="admin-page">
                    <div class="page-header">
                        <h2 class="page-title">商品管理</h2>
                        <button class="btn-primary" id="add-product-btn">+ 添加商品</button>
                    </div>
                    <div class="table-container">
                        <table class="admin-table" id="products-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>商品名称</th>
                                    <th>类型</th>
                                    <th>价格</th>
                                    <th>库存</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="products-tbody"></tbody>
                        </table>
                    </div>
                </section>

                <!-- 用户管理 -->
                <section id="users-page" class="admin-page">
                    <div class="page-header">
                        <h2 class="page-title">用户管理</h2>
                        <input type="text" id="user-search" placeholder="搜索用户名/手机号...">
                    </div>
                    <div class="table-container">
                        <table class="admin-table" id="users-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>用户名</th>
                                    <th>昵称</th>
                                    <th>手机号</th>
                                    <th>角色</th>
                                    <th>状态</th>
                                    <th>注册时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="users-tbody"></tbody>
                        </table>
                    </div>
                </section>

                <!-- 系统设置 -->
                <section id="settings-page" class="admin-page">
                    <h2 class="page-title">系统设置</h2>
                    <div class="settings-form">
                        <div class="form-group">
                            <label>商城名称</label>
                            <input type="text" id="shop-name" value="宜礼商城">
                        </div>
                        <div class="form-group">
                            <label>客服电话</label>
                            <input type="text" id="service-phone" value="400-888-8888">
                        </div>
                        <div class="form-group">
                            <label>客服微信</label>
                            <input type="text" id="service-wechat" value="yili_service">
                        </div>
                        <button class="btn-primary" id="save-settings">保存设置</button>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- 订单详情弹窗 -->
    <div class="modal" id="order-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>订单详情</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="order-detail-content">
            </div>
            <div class="modal-footer">
                <button class="btn-secondary modal-close">关闭</button>
                <button class="btn-primary" id="process-order-btn">处理订单</button>
            </div>
        </div>
    </div>

    <!-- 商品编辑弹窗 -->
    <div class="modal" id="product-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="product-modal-title">编辑商品</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="product-form">
                    <input type="hidden" id="product-id">
                    <div class="form-group">
                        <label>商品名称</label>
                        <input type="text" id="product-name" required>
                    </div>
                    <div class="form-group">
                        <label>商品类型</label>
                        <select id="product-type">
                            <option value="virtual">虚拟卡券</option>
                            <option value="physical">实物商品</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>价格</label>
                        <input type="number" id="product-price" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>库存</label>
                        <input type="number" id="product-stock" required>
                    </div>
                    <div class="form-group">
                        <label>状态</label>
                        <select id="product-status">
                            <option value="on_sale">上架</option>
                            <option value="off_sale">下架</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary modal-close">取消</button>
                <button class="btn-primary" id="save-product-btn">保存</button>
            </div>
        </div>
    </div>

    <script src="js/supabase-client.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
