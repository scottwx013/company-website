<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宜礼商城 - 员工福利优选</title>
    <meta name="description" content="宜礼商城为企业员工提供精选福利商品，涵盖电子卡券、实物礼品等，品质优选，价格实惠。">
    <meta name="keywords" content="宜礼商城,员工福利商城,企业礼品,电子卡券,福利商品">
    <meta property="og:title" content="宜礼商城 - 员工福利优选">
    <meta property="og:description" content="宜礼商城为企业员工提供精选福利商品，涵盖电子卡券、实物礼品等，品质优选，价格实惠。">
    <meta property="og:type" content="website">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .category-btn.active { background: #7c3aed; color: white; }
        .cart-badge { animation: bounce 0.3s; }
        @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }

        /* Banner */
        .banner-container { position: relative; overflow: hidden; border-radius: 16px; }
        .banner-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.6s ease; display: flex; align-items: center; justify-content: center; }
        .banner-slide.active { opacity: 1; position: relative; }
        .banner-dots { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10; }
        .banner-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.5); cursor: pointer; transition: all 0.3s; }
        .banner-dot.active { background: white; width: 24px; border-radius: 4px; }

        /* Category */
        .category-card { transition: all 0.3s; cursor: pointer; }
        .category-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }

        /* Featured */
        .featured-card { transition: all 0.3s; }
        .featured-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 顶部导航 -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="/" class="flex items-center">
                    <img src="/assets/logo-purple.jpg" alt="宜礼" class="h-8 w-auto">
                    <span class="ml-2 text-xl font-bold text-gray-800">商城</span>
                </a>
                
                <div class="flex-1 max-w-lg mx-8">
                    <div class="relative">
                        <input type="text" id="searchInput" placeholder="搜索商品..." 
                            class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-full focus:outline-none focus:border-purple-500">
                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    </div>
                </div>
                
                <div class="flex items-center space-x-4">
                    <a href="../index.html" class="text-sm text-gray-600 hover:text-purple-600 font-medium">官网</a>
                    <a href="cart.html" class="relative p-2 text-gray-600 hover:text-purple-600">
                        <i class="fas fa-shopping-cart text-xl"></i>
                        <span id="cartCount" class="cart-badge absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center hidden">0</span>
                    </a>
                    <a href="orders.html" class="p-2 text-gray-600 hover:text-purple-600">
                        <i class="fas fa-file-invoice text-xl"></i>
                    </a>
                    <div id="userSection" class="flex items-center space-x-2">
                        <a href="login.html" class="text-sm text-purple-600 hover:text-purple-700 font-medium">登录</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Banner 轮播 -->
    <section class="max-w-7xl mx-auto px-4 pt-4">
        <div class="banner-container h-48 md:h-64">
            <div class="banner-slide active h-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white px-8 md:px-16">
                <div class="max-w-lg">
                    <h2 class="text-2xl md:text-4xl font-bold mb-2">企业福利首选平台</h2>
                    <p class="text-purple-100 text-sm md:text-base">一站式员工福利解决方案，覆盖电子卡券与实物礼品</p>
                    <button onclick="scrollToProducts()" class="mt-4 px-6 py-2 bg-white text-purple-600 rounded-full font-medium text-sm hover:bg-purple-50 transition">立即选购</button>
                </div>
            </div>
            <div class="banner-slide h-full bg-gradient-to-r from-blue-500 to-cyan-500 text-white px-8 md:px-16">
                <div class="max-w-lg">
                    <h2 class="text-2xl md:text-4xl font-bold mb-2">电子卡券即时到账</h2>
                    <p class="text-blue-100 text-sm md:text-base">电影票、购物卡、餐饮券，员工即买即用，无需等待</p>
                    <button onclick="filterByCategory('virtual')" class="mt-4 px-6 py-2 bg-white text-blue-500 rounded-full font-medium text-sm hover:bg-blue-50 transition">查看卡券</button>
                </div>
            </div>
            <div class="banner-slide h-full bg-gradient-to-r from-orange-500 to-red-500 text-white px-8 md:px-16">
                <div class="max-w-lg">
                    <h2 class="text-2xl md:text-4xl font-bold mb-2">实物礼品全国配送</h2>
                    <p class="text-orange-100 text-sm md:text-base">精选品质好礼，全国300+城市快递直达</p>
                    <button onclick="filterByCategory('physical')" class="mt-4 px-6 py-2 bg-white text-orange-500 rounded-full font-medium text-sm hover:bg-orange-50 transition">查看礼品</button>
                </div>
            </div>
            <div class="banner-dots">
                <div class="banner-dot active" onclick="goToSlide(0)"></div>
                <div class="banner-dot" onclick="goToSlide(1)"></div>
                <div class="banner-dot" onclick="goToSlide(2)"></div>
            </div>
        </div>
    </section>

    <!-- 分类快捷入口 -->
    <section class="max-w-7xl mx-auto px-4 py-6">
        <div class="grid grid-cols-3 gap-4">
            <div class="category-card bg-white rounded-xl p-4 text-center shadow-sm" onclick="filterByCategory('virtual')">
                <div class="w-12 h-12 mx-auto mb-2 bg-blue-100 rounded-full flex items-center justify-center">
                    <i class="fas fa-ticket-alt text-blue-600 text-xl"></i>
                </div>
                <h3 class="font-medium text-gray-800 text-sm">电子卡券</h3>
                <p class="text-xs text-gray-500 mt-1">即时到账</p>
            </div>
            <div class="category-card bg-white rounded-xl p-4 text-center shadow-sm" onclick="filterByCategory('physical')">
                <div class="w-12 h-12 mx-auto mb-2 bg-green-100 rounded-full flex items-center justify-center">
                    <i class="fas fa-box-open text-green-600 text-xl"></i>
                </div>
                <h3 class="font-medium text-gray-800 text-sm">实物商品</h3>
                <p class="text-xs text-gray-500 mt-1">全国配送</p>
            </div>
            <div class="category-card bg-white rounded-xl p-4 text-center shadow-sm" onclick="window.location.href='../contact.html'">
                <div class="w-12 h-12 mx-auto mb-2 bg-purple-100 rounded-full flex items-center justify-center">
                    <i class="fas fa-building text-purple-600 text-xl"></i>
                </div>
                <h3 class="font-medium text-gray-800 text-sm">企业团购</h3>
                <p class="text-xs text-gray-500 mt-1">定制方案</p>
            </div>
        </div>
    </section>

    <!-- 精选福利 -->
    <section class="max-w-7xl mx-auto px-4 pb-4">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-bold text-gray-800">精选福利</h2>
            <span class="text-sm text-gray-500">人气推荐</span>
        </div>
        <div id="featuredGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
    </section>

    <!-- 促销横幅 -->
    <section class="max-w-7xl mx-auto px-4 py-4">
        <div class="bg-gradient-to-r from-emerald-500 to-teal-500 rounded-xl p-4 md:p-6 text-white flex items-center justify-between cursor-pointer" onclick="window.location.href='../contact.html'">
            <div>
                <h3 class="font-bold text-lg">企业批量采购享专属折扣</h3>
                <p class="text-emerald-100 text-sm">满 100 单享 95 折，满 500 单享 9 折，联系客服定制方案</p>
            </div>
            <i class="fas fa-chevron-right text-white text-xl"></i>
        </div>
    </section>

    <!-- 分类导航 -->
    <div class="bg-white border-b">
        <div class="max-w-7xl mx-auto px-4 py-3">
            <div class="flex space-x-2 overflow-x-auto">
                <button class="category-btn active px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition" data-category="all">全部商品</button>
                <button class="category-btn px-4 py-2 rounded-full text-sm font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 whitespace-nowrap transition" data-category="virtual">电子卡券</button>
                <button class="category-btn px-4 py-2 rounded-full text-sm font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 whitespace-nowrap transition" data-category="physical">实物商品</button>
            </div>
        </div>
    </div>

    <!-- 商品列表 -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6"></div>
        <div id="emptyState" class="hidden text-center py-20">
            <i class="fas fa-box-open text-6xl text-gray-300 mb-4"></i>
            <p class="text-gray-500">暂无商品</p>
        </div>
    </main>

    <script src="../js/supabase-client.js"></script>
    <script src="shop-data.js"></script>
    <script>
        let products = [];
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        let currentCategory = 'all';
        let bannerIndex = 0;
        let bannerInterval;

        document.addEventListener('DOMContentLoaded', () => {
            loadProducts();
            updateCartBadge();
            updateUserSection();
            setupEventListeners();
            startBannerCarousel();
        });

        // Banner 轮播
        function startBannerCarousel() {
            bannerInterval = setInterval(() => {
                goToSlide((bannerIndex + 1) % 3);
            }, 5000);
        }

        function goToSlide(index) {
            bannerIndex = index;
            document.querySelectorAll('.banner-slide').forEach((s, i) => {
                s.classList.toggle('active', i === index);
            });
            document.querySelectorAll('.banner-dot').forEach((d, i) => {
                d.classList.toggle('active', i === index);
            });
        }

        function scrollToProducts() {
            document.querySelector('.category-btn[data-category="all"]').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function filterByCategory(cat) {
            document.querySelectorAll('.category-btn').forEach(b => {
                b.classList.remove('active');
                b.classList.add('bg-gray-100', 'text-gray-600');
            });
            const btn = document.querySelector('.category-btn[data-category="' + cat + '"]');
            if (btn) {
                btn.classList.add('active');
                btn.classList.remove('bg-gray-100', 'text-gray-600');
            }
            currentCategory = cat;
            renderProducts();
            scrollToProducts();
        }

        function loadProducts() {
            getProducts().then(function(data) {
                products = data || [];
                renderFeatured();
                renderProducts();
            }).catch(function(err) {
                console.error('加载商品失败:', err);
                products = [];
                renderFeatured();
                renderProducts();
            });

            // 登录用户：从服务器加载购物车并合并
            var user = getCurrentUser();
            if (user) {
                loadCartFromServer().then(function() {
                    cart = getLocalCart();
                    updateCartBadge();
                });
            }
        }

        // 渲染精选福利（价格最高的4个）
        function renderFeatured() {
            const grid = document.getElementById('featuredGrid');
            if (!products.length) {
                grid.innerHTML = '';
                return;
            }
            const featured = products.slice().sort(function(a, b) { return b.price - a.price; }).slice(0, 4);
            grid.innerHTML = featured.map(p => `
                <div class="featured-card bg-white rounded-xl overflow-hidden shadow-sm cursor-pointer" onclick="goToProduct(${p.id})">
                    <div class="aspect-square overflow-hidden bg-gray-100 relative">
                        <img src="${p.images[0]}" alt="${p.name}" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300">
                        <span class="absolute top-2 left-2 px-2 py-0.5 text-xs rounded-full bg-red-500 text-white">精选</span>
                    </div>
                    <div class="p-3">
                        <h3 class="font-medium text-gray-800 text-sm line-clamp-1">${p.name}</h3>
                        <div class="flex items-center justify-between mt-1">
                            <span class="text-base font-bold text-red-500">¥${p.price}</span>
                            <button onclick="event.stopPropagation(); addToCart(${p.id})" class="w-7 h-7 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center hover:bg-purple-600 hover:text-white transition">
                                <i class="fas fa-plus text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            const emptyState = document.getElementById('emptyState');
            
            let filtered = products;
            if (currentCategory !== 'all') {
                filtered = products.filter(p => p.type === currentCategory);
            }
            
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            if (searchTerm) {
                filtered = filtered.filter(p => 
                    p.name.toLowerCase().includes(searchTerm) || 
                    p.description.toLowerCase().includes(searchTerm)
                );
            }
            
            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            grid.innerHTML = filtered.map(p => `
                <div class="product-card bg-white rounded-xl overflow-hidden shadow-sm transition-all duration-300 cursor-pointer" onclick="goToProduct(${p.id})">
                    <div class="aspect-square overflow-hidden bg-gray-100">
                        <img src="${p.images[0]}" alt="${p.name}" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300">
                    </div>
                    <div class="p-4">
                        <span class="px-2 py-0.5 text-xs rounded-full ${p.type === 'virtual' ? 'bg-blue-100 text-blue-600' : 'bg-green-100 text-green-600'}">${p.type === 'virtual' ? '电子卡券' : '实物商品'}</span>
                        <h3 class="font-medium text-gray-800 mb-1 line-clamp-2 mt-2">${p.name}</h3>
                        <p class="text-sm text-gray-500 mb-3 line-clamp-1">${p.description}</p>
                        <div class="flex items-center justify-between">
                            <div>
                                <span class="text-lg font-bold text-red-500">¥${p.price}</span>
                                ${p.originalPrice > p.price ? `<span class="text-sm text-gray-400 line-through ml-2">¥${p.originalPrice}</span>` : ''}
                            </div>
                            <button onclick="event.stopPropagation(); addToCart(${p.id})" class="w-8 h-8 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center hover:bg-purple-600 hover:text-white transition">
                                <i class="fas fa-plus text-sm"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function goToProduct(id) {
            window.location.href = `product.html?id=${id}`;
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            
            const existing = cart.find(item => item.productId === productId);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({
                    productId: product.id,
                    name: product.name,
                    price: product.price,
                    image: product.images[0],
                    type: product.type,
                    quantity: 1
                });
            }
            
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartBadge();
            syncCartToServer();
            showToast('已添加到购物车', 'success');
        }

        function updateCartBadge() {
            const badge = document.getElementById('cartCount');
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            if (count > 0) {
                badge.textContent = count;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function updateUserSection() {
            const userSection = document.getElementById('userSection');
            const user = getCurrentUser();
            if (user) {
                userSection.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <span class="text-sm text-gray-600">${user.username}</span>
                        <button onclick="logout()" class="text-sm text-red-500 hover:text-red-600">退出</button>
                    </div>
                `;
            } else {
                userSection.innerHTML = `<a href="login.html" class="text-sm text-purple-600 hover:text-purple-700 font-medium">登录</a>`;
            }
        }

        function logout() {
            clearCurrentUser();
            updateUserSection();
            showToast('已退出登录', 'success');
        }

        function setupEventListeners() {
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.category-btn').forEach(b => {
                        b.classList.remove('active');
                        b.classList.add('bg-gray-100', 'text-gray-600');
                    });
                    btn.classList.add('active');
                    btn.classList.remove('bg-gray-100', 'text-gray-600');
                    currentCategory = btn.dataset.category;
                    renderProducts();
                });
            });
            document.getElementById('searchInput').addEventListener('input', renderProducts);
        }
    </script>

    <footer class="bg-white border-t mt-12 py-6">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-sm text-gray-500">© 2026 宜礼商城 · <a href="privacy.html" class="text-purple-600 hover:text-purple-700">隐私政策</a> · <a href="terms.html" class="text-purple-600 hover:text-purple-700">用户协议</a></p>
        </div>
    </footer>
</body>
</html>
